name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t lint typecheck vite:test build --output-style=static

  integration:
    name: Intégration contre Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Seuls la base, l'API de données et l'auth servent aux tests.
      - run: supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Variables du Supabase local
        run: supabase status -o env | sed 's/"//g' >> "$GITHUB_ENV"
      - run: npx nx run api:test-integration --output-style=static
      - run: npx nx vite:test supabase --skip-nx-cache --output-style=static
        env:
          SUPABASE_INTEGRATION: '1'
